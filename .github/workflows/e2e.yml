name: E2E

# Runs nightly, and on demand. The cron is DUE at 20:17 America/Chicago, but
# GitHub has been delivering it hours late, so it actually STARTS overnight -
# typically 02:00-03:30 CT. Read "WHY 20:17" below before moving it.
#
# GitHub cron is UTC-only and knows nothing about DST, so "20:17 Central" takes
# two entries - 01:17 UTC is 20:17 CDT, 02:17 UTC is 20:17 CST (both the evening
# of the PREVIOUS Chicago day) - and the `gate` job below lets exactly one of them
# through each night.
#
# The gate decides from WHICH cron fired (github.event.schedule) and what the
# Chicago clock read at that cron's SCHEDULED instant - never from the wall clock
# when the job happens to start. GitHub delivers scheduled runs late, sometimes by
# hours, so a wall-clock test ("is it 20:xx in Chicago now?") would say no to both
# and skip every nightly while showing green - which is exactly what happened from
# 2026-09-25 with the old 02:00 wall-clock test. Anchoring on the scheduled instant
# makes the verdict independent of the delay: the 01:17 UTC cron is the nightly
# exactly when Chicago is on CDT, the 02:17 UTC one exactly when it is on CST, so
# one runs and one skips on every night of the year, however late either arrives.
#
# WHY 20:17 (moved from 02:17 on 2026-10-06). Until 2026-09-24 GitHub delivered
# the crons 0-15 min late. From 2026-09-25 it delivered every one of them
# 271-532 min late (24 runs through 2026-10-06: median 392, middle half 336-430),
# so a 02:17 CT cron started at 06:48-11:09 CT - in the working day, where the
# lateness check below skipped nearly all of them. Due at 20:17 CT, the same delays
# start the run at 00:48-05:09 CT (median 02:49), and a ~90-130 min run is done
# before ~07:00. If GitHub goes back to delivering on time, the run starts at
# 20:17 CT instead: still outside the working day, but move the cron back toward
# 02:17 then. The delays were measured for crons due at 07-08 UTC; the lateness
# check is what protects dev if crons due at 01-02 UTC are delayed differently.
#
# The minute is :17, not :00, because the top of the hour is when GitHub's
# scheduler is most loaded and drops or delays the most runs (GitHub's own advice).
#
# The gate also skips TONIGHT'S cron when GitHub delivers it more than 10 h after
# its due instant (MAX_LATE_MIN), i.e. later than 06:17 CT, because by then the
# run's clear and teardown would wipe dev's e2e data in the middle of the working
# day. Manual dispatches are never skipped. See the comment at that check.
#
# A skipped run still ends green - the skip is not a failure - so the gate writes
# a job summary line and a notice saying SKIPPED on every skip. Read the summary,
# not the colour: a green run whose `e2e` job is "skipped" tested nothing.
#
# Note the suite had no recorded green run when the schedule was switched on, so
# expect red until the baseline is clean. A nightly nobody reads is worse than no
# nightly: if it stays red, fix it or turn the `schedule:` block back off.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "App origin to test against (blank = the TT_BASE_URL secret)"
        required: false
        type: string
      trace:
        description: "Profile playwright-cli process cost (tools/pw-trace)"
        required: false
        default: false
        type: boolean
      no_fail_fast:
        description: "Run every step even after a failure (KEEPS WRITING - read the note in run-tests.sh)"
        required: false
        default: false
        type: boolean
  schedule:
    # The gate parses these two strings; keep the minute and hour fields literal.
    - cron: "17 1 * * *"   # 20:17 CDT the evening before (roughly Mar-Nov)
    - cron: "17 2 * * *"   # 20:17 CST the evening before (roughly Nov-Mar)

concurrency:
  # One run at a time: the suite mutates shared test data on the target environment.
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # An `if:` expression cannot evaluate a timezone, so the DST decision is made
  # here in a shell and handed to the real job as an output. The cron that is not
  # tonight's costs about ten seconds and leaves a skipped `e2e` job plus a
  # SKIPPED summary line rather than a red run.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          # A scheduled run delivered later than this after its due instant is
          # skipped - see the comment at the check below.
          MAX_LATE_MIN: "600"
        run: |
          # If tzdata were missing, TZ would be ignored and `date` would hand back
          # UTC hours - which never equal 20 for these crons, so the nightly would
          # skip every night and never go red. Fail loudly instead of disappearing
          # quietly.
          zone=$(TZ=America/Chicago date +%Z)
          case "$zone" in
            CST|CDT) ;;
            *) echo "::error::America/Chicago is unavailable on this runner (date reported '$zone'). Cannot tell which cron is tonight's."; exit 1 ;;
          esac

          # Resolved on every trigger, not just the cron, so a manual run also
          # proves the zone still works here.
          echo "Chicago local time now is $(TZ=America/Chicago date '+%H:%M %Z')."

          if [ "$EVENT" != "schedule" ]; then
            echo "Triggered by $EVENT, not the nightly cron - running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ran: triggered by \`$EVENT\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # WHICH cron fired. github.event.schedule is the cron string exactly as
          # written under `schedule:` above, e.g. "17 1 * * *".
          read -r cmin chour _ <<< "$SCHEDULE"
          case "$cmin$chour" in
            ''|*[!0-9]*) echo "::error::Cannot parse the cron that fired ('$SCHEDULE')."; exit 1 ;;
          esac

          # WHEN it was due: the latest HH:MM UTC at or before now. GitHub delays a
          # scheduled run by minutes to hours, never by a day, so the most recent
          # occurrence of that time of day is the one this run was meant for.
          now=$(date -u +%s)
          due=$(date -u -d "$(date -u -d "@$now" +%F) $chour:$cmin" +%s)
          [ "$due" -gt "$now" ] && due=$(( due - 86400 ))
          late=$(( (now - due) / 60 ))

          # What Chicago's clock read AT THE DUE INSTANT, not now. That is what
          # makes the verdict independent of the delay.
          hour=$(TZ=America/Chicago date -d "@$due" +%H)
          due_ct=$(TZ=America/Chicago date -d "@$due" '+%F %H:%M %Z')
          echo "Cron '$SCHEDULE' was due at $(date -u -d "@$due" '+%F %H:%M') UTC = $due_ct; delivered ${late} min late."

          # Exactly one of the two crons reads 20 in Chicago, every day of the
          # year: 01:17 UTC is 20:17 CDT or 19:17 CST, 02:17 UTC is 21:17 CDT or
          # 20:17 CST. The DST switches happen at 02:00 local (07:00-08:00 UTC),
          # nowhere near either due instant, so neither transition Sunday needs a
          # special case - the 02:17 schedule needed one for spring-forward, when
          # neither of its crons read 02.
          if [ "$hour" = "20" ]; then
            # TONIGHT'S NIGHTLY, BUT IS IT STILL NIGHT? A nightly exists to run while
            # nobody is using dev: its 00-setup clear and 99-teardown DELETE every e2e
            # consultant's timesheets, assignments and projects. Delivered late
            # enough, it lands in the working day instead: on 2026-10-06 a 02:17 cron
            # delivered 416 min late wiped dev under a session testing against it.
            #
            # MAX_LATE_MIN is 600: due 20:17 CT plus 10 h is 06:17 CT, the same latest
            # start the 02:17 schedule allowed, and a ~90-130 min run started then is
            # finished by ~08:00-08:30. Any later and it is still clearing and
            # re-seeding dev when people start work. It is not smaller because the
            # delays this schedule exists to absorb are 271-532 min (2026-09-25 to
            # 10-06) - a limit under ~540 would start skipping ordinary nights again.
            # Lateness is measured from the cron's DUE instant, like the DST verdict
            # above, so the two checks agree on what "late" is.
            if [ "$late" -gt "$MAX_LATE_MIN" ]; then
              start_ct=$(TZ=America/Chicago date -d "@$now" '+%H:%M %Z')
              echo "Tonight's nightly, but delivered ${late} min late (limit ${MAX_LATE_MIN}): it would start at $start_ct, inside the working day. Skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Nightly skipped (delivered late)::cron '$SCHEDULE' was due at $due_ct but GitHub delivered it ${late} min late ($start_ct). Over the ${MAX_LATE_MIN}-min limit, so it was not run: its clear and teardown would wipe dev's e2e data during the working day. No tests ran in this run."
              echo "**SKIPPED - no tests ran.** Tonight's nightly (cron \`$SCHEDULE\`, due $due_ct) was delivered ${late} min late, at $start_ct - over the ${MAX_LATE_MIN}-min limit, so it would have cleared and re-seeded dev during the working day. Dispatch the workflow by hand to run it now. This run's green is not a test result." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "This is tonight's nightly (due 20:17 CT)."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ran: tonight's nightly (cron \`$SCHEDULE\`, due $due_ct, delivered ${late} min late)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Not tonight's 20:17 CT slot - this is the other DST cron. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nightly skipped::cron '$SCHEDULE' was due at $due_ct, which is not 20:xx in Chicago - the other DST cron is tonight's nightly. No tests ran in this run."
            echo "**SKIPPED - no tests ran.** Cron \`$SCHEDULE\` was due at $due_ct, not 20:xx in Chicago; the other DST cron is tonight's nightly. This run's green is not a test result." >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 45 was not enough for a first full run against cloud dev; raised so the
    # baseline can actually finish rather than being guillotined mid-suite.
    #
    # 90 was not enough either, and fail-fast hid that for weeks: every run that
    # fit inside it only fit because a failure aborted the tail. The first
    # all-green run (33684417368) needed 89 minutes of test time alone and was
    # killed 33s into verify-hr-reject-after-export with seven scripts still to
    # go - including the teardown that clears the test data. An all-green run is
    # the SLOWEST possible run, so the budget has to cover that, not the runs
    # that got cut short. 150 left real headroom over that ~90.
    #
    # Raised to 210 for the Dev Review coverage wave (TT-721/729/732/735/737 and
    # the TT-738 queue-drain check still to come). Those add roughly 40 minutes,
    # most of it one deliberate wait: proving the 2-minute email queue actually
    # drains costs ~12 minutes of wall clock on its own and cannot be hurried.
    # At 150 an all-green run would have sat around 130 with ~13% headroom, and
    # the failure mode is not a lost minute - it is the run being guillotined
    # before 99-teardown, which leaves e2e test data on the target environment
    # for the next run to trip over. 210 restores roughly the headroom ratio 150
    # gave 89. An unused ceiling costs nothing; billing is actual runtime.
    #
    # This is the OUTER ceiling and it is not survivable: it lands as a signal, and
    # run-tests.sh cannot run a multi-minute teardown from a signal handler. The step
    # below therefore also passes --deadline 195, an internal clock that stops starting
    # new steps with ~15m to spare and still runs 99-teardown. If you raise or lower
    # this number, move that one with it and keep the gap.
    timeout-minutes: 210

    # The browser runs on Chicago time, like the people who use the app. The runner
    # is UTC, and a UTC browser hides every bug that comes from rendering an
    # unlocalized date in the viewer's zone: on 2026-09-28 HR's Monthly tab labelled
    # its month groups one month EARLY in a Chicago browser (Oct 1 00:00 UTC is
    # Sep 30 in Chicago), and verify-hr-monthly-group-month-label went green here
    # (run 36553422511) while it was red on a Chicago machine.
    #
    # Why an env var reaches the browser: run-tests.sh's `playwright-cli open` starts
    # the cli's daemon, the daemon launches Chromium, and each inherits this job's
    # environment. Chromium on Linux takes its default time zone (ICU, and so every
    # Intl / Date call in the page) from TZ. Job-level rather than step-level so any
    # later step that opens a browser gets it too. It also puts the specs' own `date`
    # calls on Chicago time, which is what a local run on Josh's machine already does.
    env:
      TZ: America/Chicago

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          npx playwright-cli install || true
          npx playwright-cli install-browser chromium

      # pdftotext, for verify-tt683-a3, which reads the BODY of each exported PDF
      # rather than only its name, size and checksum. That is the only assertion
      # in the suite that can tell one consultant's timesheet from another's
      # inside the archive, so it must not be quietly skipped.
      #
      # poppler-utils is not in the ubuntu-latest image's documented package
      # list, so this cannot be assumed present -- but the list names notable
      # packages rather than every one, so it may well be. Conditional on that
      # account: a no-op costing nothing when the tool is already there, and an
      # apt install of about a second when it is not.
      #
      # The spec FAILS rather than skips when pdftotext is missing, so if this
      # step is ever removed the suite says so instead of going quietly green.
      - name: Install poppler-utils (pdftotext)
        shell: bash
        run: |
          command -v pdftotext >/dev/null 2>&1 && { pdftotext -v 2>&1 | head -1; exit 0; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -v 2>&1 | head -1

      - name: Run suite
        shell: bash
        env:
          TT_BASE_URL: ${{ inputs.base_url || secrets.TT_BASE_URL }}
          TT_ADMIN_USER: ${{ secrets.TT_ADMIN_USER }}
          TT_ADMIN_PASS: ${{ secrets.TT_ADMIN_PASS }}
          TT_ROLE_PASS: ${{ secrets.TT_ROLE_PASS }}
          TT_E2E_CONSULTANTS: ${{ secrets.TT_E2E_CONSULTANTS }}
          # verify-unittests needs this to reach the UnitTesting remote API. The
          # secret existed but was never passed through, so the step failed with
          # "TT_UNITTEST_PASS is not set" on every run.
          TT_UNITTEST_PASS: ${{ secrets.TT_UNITTEST_PASS }}
        run: |
          chmod +x ./run-tests.sh
          # No --verbose: failures already print their own output, and at 50
          # scripts the passing chatter buried the signal.
          #
          # No --junit either: nothing consumes results.xml. It is not rendered
          # as a check annotation and no dashboard reads the artifact, so the
          # step log is the only thing anyone actually looks at. Worse, the file
          # is written only after the whole loop, so the one run where it would
          # have paid off - a timeout - produced no file at all.
          # Profiling is opt-in per dispatch and off for the nightly. It must be
          # SOURCED, not run: it works by putting tools/pw-trace on PATH ahead of
          # the real playwright-cli, and a child process cannot change our PATH.
          #
          # The `||` block is not decoration. This block runs under `bash -e`, so
          # a `return 1` out of a SOURCED file aborts the step immediately - before
          # a single test runs - and all the log carries is enable.sh's one line of
          # stderr followed by "Process completed with exit code 1", which reads
          # like the suite failed. Stopping is the right call (a profiling dispatch
          # that cannot profile should not spend three hours producing a baseline
          # with no trace), but it has to say so.
          if [ "${{ inputs.trace }}" = "true" ]; then
            source tools/pw-trace/enable.sh "$PWD/pw-trace.log" || {
              echo "::error::pw-trace could not be enabled (see the message above); no tests were run. Re-dispatch with trace=false to run the suite untraced."
              exit 1
            }
          fi

          # GitHub runs `run:` blocks under `bash -e`, so a failing suite would
          # abort the step here and the report below would never print - on
          # exactly the runs where it is most useful. Hold the exit code instead
          # and re-raise it after reporting.
          # Fail-fast is right for a normal run and wrong for a profiling one: the
          # first failure aborts the tail, so a trace taken while the suite is red
          # covers only the steps before it. On 2026-09-03 that was 34 of 77, none
          # of them the ones being optimised.
          #
          # It stays OPT-IN because the cost is real - run-tests.sh's own note says
          # it plainly: a run that keeps going keeps WRITING, against a state nobody
          # designed. Teardown still runs either way.
          FF=""
          if [ "${{ inputs.no_fail_fast }}" = "true" ]; then
            FF="--no-fail-fast"
            echo "NOTE: fail-fast disabled - later steps run against post-failure state."
          fi

          rc=0
          # --expect-count: the discovery gate. Without it the RUN ITSELF cannot fail --
          # rename a test out of the verify-*.test.sh glob and the runner reports
          # "95 tests: 95 passed" with exit 0. run-tests.sh's own header says CI should
          # always pass it.
          #
          # The number is READ FROM suites/expected-count.txt, not written here. It used
          # to be hardcoded, and on 2026-09-17 the two drifted apart: the file was kept
          # current at 125 as tests landed through #114-#123, this line still said 100,
          # and the gate then refused EVERY run - the nightly included - before a single
          # test executed. A guard that blocks the suite because of its own bookkeeping
          # is worse than no guard, so there is now one number in one place. Same parse
          # as suites/80-platform/verify-run-budget.test.sh, which asserts that file
          # against real discovery from inside the run.
          EXPECT="$(grep -vE '^[[:space:]]*(#|$)' suites/expected-count.txt | head -1 | tr -d '[:space:]')"
          case "$EXPECT" in
            ''|*[!0-9]*)
              echo "::error::suites/expected-count.txt does not begin with a number (read: [$EXPECT]); cannot set the discovery gate."
              exit 2 ;;
          esac
          echo "discovery gate: expecting $EXPECT test(s), per suites/expected-count.txt"
          #
          # --deadline: the INTERNAL clock, and the reason timeout-minutes alone is not
          # enough. GitHub's ceiling arrives as a signal; run-tests.sh's handler closes
          # the browser and exits without running 99-teardown, so a guillotined run
          # leaves e2e timesheets, assignments and projects on dev for the NEXT run to
          # trip over -- which surfaces as somebody else's mysterious red, not as this
          # run's failure. The internal deadline is checked between steps, where there
          # is room to spend the few minutes teardown needs. 195 leaves ~15m of headroom
          # under timeout-minutes: 210; keep that gap when either number moves.
          ./run-tests.sh --skip-file ci-skip.txt --expect-count "$EXPECT" --deadline 195 $FF || rc=$?

          if [ -s "${TT_PW_TRACE_FILE:-}" ]; then
            echo
            echo "================ playwright-cli process cost ================"
            tools/pw-trace/report.sh "$TT_PW_TRACE_FILE" || true
          fi
          exit $rc

      # The raw trace, for diffing one run against another. The report above is
      # in the step log, but comparing two runs needs the lines themselves.
      - name: Upload pw-trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pw-trace
          path: pw-trace.log
          if-no-files-found: ignore
          retention-days: 30

      # Screenshots only, and `ignore` rather than `warn`: a green run has no
      # screenshots by definition, so warning about it is noise on exactly the
      # runs that went well.
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: "*-failure.png"
          if-no-files-found: ignore
          retention-days: 30
