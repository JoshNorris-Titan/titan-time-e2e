name: Password refresh — weekly

# Sets every e2e_* and manual_* account's password away and straight back, once a week,
# so none of them ages into a forced password reset and breaks the nightly.
#
# THE PASSWORD DOES NOT CHANGE. Each account ends the run on exactly the value it started
# on, so NO SECRET NEEDS UPDATING afterwards — not TT_ROLE_PASS, not TT_MANUAL_PASS, not
# .e2e-autofix.env, not anyone's notes. It is a keep-alive, not a rotation. If it ever
# starts behaving like a rotation, that is a bug in password-refresh/, not a new procedure.
#
# WHY IT IS WORTH A WORKFLOW OF ITS OWN. Nothing here tests the product, so it has no
# business inside the nightly: it writes credentials on a shared environment and its
# failure mode ("an account is on a throwaway password") wants to be read on its own,
# not as one red step among ninety-three. run-tests.sh only discovers under suites/ when
# given no target, so password-refresh/ is invisible to the nightly by construction.
#
# MxAdmin IS NOT IN SCOPE. It is the credential this job authenticates with — see the
# note in password-refresh/refresh.env.sh.
#
# SUNDAY 14:00 UTC, AND NO DST GATE. That is 09:00 CDT / 08:00 CST, comfortably clear of
# the nightly, which starts at 07:00 or 08:00 UTC and may run for 210 minutes. Unlike
# e2e.yml this deliberately has no gate job: that gate exists there because the
# requirement is literally "2am Central", and half the year one of its two crons is an
# hour off. Nothing here depends on the local hour — a weekly keep-alive is just as
# effective at 08:00 as at 09:00 — so a single cron is correct and the drift across DST
# is not a defect.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "App origin to refresh on (blank = the TT_BASE_URL secret)"
        required: false
        type: string
      only:
        description: "One username, to refresh a single account (blank = all of them)"
        required: false
        type: string
      unblock:
        description: "Also clear the failed-login lockout on any account that has one"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 14 * * 0"   # Sundays, 14:00 UTC = 09:00 CDT / 08:00 CST

concurrency:
  # DELIBERATELY THE SAME GROUP AS e2e.yml, not a group of its own. The two jobs cannot
  # overlap: for about a minute per account this one holds a login on a throwaway
  # password, and a nightly that tries to sign in during that minute fails for a reason
  # that has nothing to do with the product. Sharing the group with cancel-in-progress
  # false makes GitHub QUEUE the second one instead of running it, which is the behaviour
  # wanted in both directions — the nightly starting late is a non-event, the nightly
  # failing on a password is a morning of debugging.
  #
  # The residual gap: manual-env-build / -teardown use their own 'manual-env' group and a
  # workflow can only join one, so a human dispatching either of those while this runs is
  # not fenced off. That case is recoverable (this job restores every password before it
  # finishes, and the manual workflows can simply be re-dispatched) and it needs a person
  # to click at the wrong moment on a Sunday morning, so it is accepted rather than
  # designed around.
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The declared step budgets are 75m for the churn and 30m for the verification (the
    # tt-timeout lines in password-refresh/), plus setup. The churn is three form submits
    # per account across fourteen accounts, and each one re-navigates to Account Overview
    # from a fresh page rather than trusting the state the previous save left behind —
    # which is the expensive choice and the reason the budget is not ten minutes. Both
    # numbers are estimates until the first green run; retune them from a real one rather
    # than from this comment.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          npx playwright-cli install || true
          npx playwright-cli install-browser chromium

      - name: Refresh the account passwords
        shell: bash
        env:
          TT_BASE_URL: ${{ inputs.base_url || secrets.TT_BASE_URL }}
          TT_ADMIN_USER: ${{ secrets.TT_ADMIN_USER }}
          TT_ADMIN_PASS: ${{ secrets.TT_ADMIN_PASS }}
          # A MISSING SECRET ARRIVES HERE AS AN EMPTY STRING, which is why
          # password-refresh/refresh.env.sh refuses to run without a real one rather than
          # letting lib/_login.sh's local default stand in. Without that refusal this job
          # would set every deployed account's password to 'E2ETest123!' and report PASS.
          TT_ROLE_PASS: ${{ secrets.TT_ROLE_PASS }}
          # Optional. Set this secret only if the manual_* accounts were given a different
          # password from the e2e_* ones; blank means "use TT_ROLE_PASS".
          TT_MANUAL_PASS: ${{ secrets.TT_MANUAL_PASS }}
          PR_ONLY: ${{ inputs.only }}
          PR_UNBLOCK: ${{ inputs.unblock && '1' || '0' }}
        run: |
          chmod +x ./run-tests.sh
          # TT_E2E_CONSULTANTS is deliberately NOT passed. Nothing here clears data, and
          # handing this job the clear scope would only invite a future step to use it.
          #
          # --expect-count guards the run itself: without it, a step renamed out of the
          # verify-*.test.sh glob would leave this reporting "1 test: 1 passed" while the
          # verification — the only step that proves anything — never ran at all.
          #
          # Fail-fast is left ON. The verification step carries the verify-zzz- prefix, so
          # run-tests.sh runs it even after the churn step fails, which is precisely the
          # run where its answer matters most.
          ./run-tests.sh password-refresh --expect-count 2

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: password-refresh-failures
          path: "*-failure.png"
          if-no-files-found: ignore
          retention-days: 30
